; DCTECH BLE to USB Keyboard Simulator
;
; env:esp32dev  -> ESP32 clasico. BLE funciona; USB HID NO disponible (sin USB
;                  nativo). La salida de teclado queda deshabilitada de forma
;                  segura mediante el stub de UsbKeyboardOutput.
; env:esp32-s3  -> ESP32-S3 con USB-OTG nativo. BLE + teclado USB HID real.

[env]
platform = espressif32 @ 7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv
lib_deps =
  h2zero/NimBLE-Arduino @ 1.4.3
build_flags =
  -std=gnu++17

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
; USB HID nativo: TinyUSB en modo OTG (no CDC-serie). La placa define por
; defecto ARDUINO_USB_MODE=1 (CDC-serie); se retira antes de fijar el modo OTG
; para evitar el warning de redefinicion y garantizar que gana el valor 0.
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
