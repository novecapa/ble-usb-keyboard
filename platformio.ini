; DCTECH BLE to USB Keyboard Simulator
;
; env:esp32dev     -> ESP32 clasico (p.ej. ESP32-D0WD-V3). BLE funciona; USB HID
;                     NO disponible: el SoC no tiene periferico USB-OTG y su
;                     puerto "USB" es un puente serie CP210x/CH340. La salida de
;                     teclado queda deshabilitada de forma segura mediante el
;                     stub de UsbKeyboardOutput.
; env:esp32-s3     -> ESP32-S3 con USB-OTG nativo. BLE + teclado USB HID real.
;                     Logs por UART0 (puerto "UART" de la placa).
; env:esp32-s3-cdc -> Igual que esp32-s3 pero con USB CDC + HID compuestos sobre
;                     el puerto nativo: logs y teclado por un unico cable.

[env]
platform = espressif32 @ 7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv
lib_deps =
  h2zero/NimBLE-Arduino @ 1.4.3
build_flags =
  -std=gnu++17

[env:esp32dev]
board = esp32dev

; ---------------------------------------------------------------------------
; ESP32-S3: teclado USB HID nativo
; ---------------------------------------------------------------------------
;
; ARDUINO_USB_MODE selecciona la pila USB del nucleo Arduino (core 2.0.17):
;
;   =1 -> USB-Serial-JTAG por hardware (HWCDC). NO compila TinyUSB, por lo que
;         USB.h / USBHIDKeyboard.h no existen: es imposible actuar como teclado.
;   =0 -> TinyUSB. Es el unico modo con USB HID; tambien es el modo que permite
;         componer CDC + HID en el mismo dispositivo.
;
; La placa esp32-s3-devkitc-1 define -DARDUINO_USB_MODE=1 en sus extra_flags:
; hay que retirarlo con build_unflags antes de fijar el valor 0, o el compilador
; ve una redefinicion contradictoria.
;
; ARDUINO_USB_CDC_ON_BOOT decide a que sale `Serial`:
;
;   =0 -> Serial = UART0 (puerto "UART" de la placa, /dev/cu.usbserial-*).
;   =1 -> Serial = USBCDC de TinyUSB (puerto "USB" nativo, /dev/cu.usbmodem*).
;
; Este env deja CDC_ON_BOOT=0 a proposito: mantiene los logs en el mismo tipo de
; puerto que ya usa `python3 tools/ble_monitor.py` (--port /dev/cu.usbserial-*)
; y deja el puerto nativo dedicado en exclusiva al HID, que es la combinacion
; mas estable. Requiere los dos cables USB de la devkit.
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0

; Variante de un solo cable: TinyUSB expone un dispositivo compuesto CDC + HID
; por el puerto USB nativo. Los logs pasan a /dev/cu.usbmodem*, asi que hay que
; indicarselo al monitor:
;
;   python3 tools/ble_monitor.py --port /dev/cu.usbmodem101
;
; Contrapartida conocida del CDC por TinyUSB: el puerto desaparece y se vuelve a
; enumerar en cada reinicio de la placa, y las primeras lineas del arranque
; pueden perderse antes de que el host abra el puerto.
[env:esp32-s3-cdc]
board = esp32-s3-devkitc-1
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
